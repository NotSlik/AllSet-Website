<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Request Received | AllSet Services</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
  <div class="container header-inner">
    <a href="/" class="brand" aria-label="AllSet home">
      <img src="assets/logo.png" alt="AllSet logo" class="brand-logo">
      <span class="brand-text">AllSet</span>
    </a>
  </div>
</header>

<main>
  <section class="hero" style="min-height: calc(100vh - 80px); display:flex; align-items:center;">
    <div class="hero-bg"></div>

    <div class="container hero-content"
         style="text-align:center; max-width:760px;">

      <p class="eyebrow">QUOTE REQUEST RECEIVED</p>

      <h1>
        Thanks — you're <span>AllSet.</span>
      </h1>

      <p class="hero-copy"
         style="margin-left:auto; margin-right:auto;">
        We've received your request and will contact you soon using the information you provided.
      </p>

      <div class="hero-actions" style="justify-content:center;">
        <a href="/" class="btn primary-btn">
          Back to AllSet
        </a>
      </div>

    </div>
  </section>
</main>

</body>
</html>
